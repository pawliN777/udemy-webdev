<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../pipastyle/css/main.css">
    <title>Aula 47 - Cronômetro</title>
</head>
<body class="body-container">
    <section class="container card-alt glass-dark">
        <h1>Cronômetro</h1>
        <div>
            <h1 id="timer" class="font-code f-100">00:00:00</h1>
        </div>
        <div class="container row">
            <button id="start" class="btn btn-confirm w-100">Iniciar</button>
            <button id="pause" class="btn btn-primary w-100">Parar</button>
            <button id="reset" class="btn btn-error w-100">Zerar</button>
        </div>
    </section>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
