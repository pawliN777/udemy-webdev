<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../pipastyle/main.css">
    <title>Aula 47 - Cronômetro</title>
</head>
<body class="bg-gray-200">
    <main class="min-h-screen d-flex justify-content-center align-items-center">
        <section class="card shadow-lg text-center p-2">
            <header class="card-header text-primary mb-2">
                <h1>Cronômetro</h1>
            </header>
            <div>
                <h1 id="timer" class="font-mono text-4xl mb-2">00:00:00</h1>
            </div>
            <div class="d-flex mb-2">
                <button id="start" class="btn btn-primary btn-md flex-fill">Iniciar</button>
            </div>
            <div class="d-flex gap-2">
                <button id="pause" class="btn btn-secondary btn-md flex-fill">Parar</button>
                <button id="reset" class="btn btn-secondary btn-md flex-fill">Zerar</button>
            </div>
        </section>
    </main>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
