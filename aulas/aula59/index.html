<!doctype html>
<html lang="pt-br" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../pipastyle/main.css" />
    <title>Aula 59 - Calculadora 2.0</title>
  </head>
  <body class="bg-gray-100">
    <main class="min-h-screen d-flex justify-content-center align-items-center flex-column">
      <div class="card shadow-lg p-2 mb-5 rounded-full">
        <button
          id="theme-toggle"
          class="btn btn-secondary square-md btn-icon-circle rounded-full"
        >
          <i class="icon icon-sun-moon text-2xl"></i>
        </button>
      </div>
      <section
        class="card w-size-25 d-flex flex-column justify-content-center align-items-center text-align-center shadow-lg rounded-2xl"
      >
        <div data-card class="container pb-4">
          <header class="card-header mb-4">
            <h1 class="card-title text-3xl text-primary text-center">
              Calculadora
            </h1>
          </header>
          <input
            data-display
            class="form-control bg-gray-100 w-100 text-4xl font-mono text-end"
          />
          <div class="d-flex gap-2 pt-4">
            <button
              data-clear="clear"
              class="btn btn-lg btn-danger-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              <i class="icon icon-trash-2"></i>
            </button>
            <button
              data-backspace="backspace"
              class="btn btn-lg btn-danger-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              <i class="icon icon-delete"></i>
            </button>
            <button
              data-number="("
              class="btn btn-lg btn-primary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              (
            </button>
            <button
              data-number=")"
              class="btn btn-lg btn-primary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              )
            </button>
          </div>
          <div class="d-flex gap-2 pt-2">
            <button
              data-number="7"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              7
            </button>
            <button
              data-number="8"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              8
            </button>
            <button
              data-number="9"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              9
            </button>
            <button
              data-number="/"
              class="btn btn-lg btn-primary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              <i class="icon icon-divide"></i>
            </button>
          </div>
          <div class="d-flex gap-2 pt-2">
            <button
              data-number="4"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              4
            </button>
            <button
              data-number="5"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              5
            </button>
            <button
              data-number="6"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              6
            </button>
            <button
              data-number="*"
              class="btn btn-lg btn-primary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              <i class="icon icon-x"></i>
            </button>
          </div>
          <div class="d-flex gap-2 pt-2">
            <button
              data-number="1"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              1
            </button>
            <button
              data-number="2"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              2
            </button>
            <button
              data-number="3"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              3
            </button>
            <button
              data-number="+"
              class="btn btn-lg btn-primary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              <i class="icon icon-plus"></i>
            </button>
          </div>
          <div class="d-flex gap-2 pt-2">
            <button
              data-number="."
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              .
            </button>
            <button
              data-number="0"
              class="btn btn-lg btn-secondary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              0
            </button>
            <button
              data-equal="equal"
              class="btn btn-lg btn-success-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              <i class="icon icon-equal"></i>
            </button>
            <button
              data-number="-"
              class="btn btn-lg btn-primary-ghost square-lg rounded-full text-2xl flex-grow-1"
            >
              <i class="icon icon-minus"></i>
            </button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
