<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../pipastyle/css/main.css">
    <title>Aula 48 - Lista de Tarefas</title>
</head>
<body class="body-container">
    <section class="container card-alt">
        <h1>Lista de tarefas</h1>
        <form id="form-task" class="row">
            <input maxlength="60" id="input-task" class="input-dark w-100" type="text" placeholder="Ex: Ir ao mercado às 9h">
            <button id="add-task" class="btn btn-confirm no-wrap">Adicionar</button>
        </form>
        <ul id="list" class="task-list self-start mt-2 w-100">
        </ul>
    </section>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
