<!doctype html>
<html lang="pt-br" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../pipastyle/main.css" />
    <title>Aula 57 - Calculadora</title>
  </head>

  <body class="bg-gray-100">
    <main
      class="min-h-screen d-flex justify-content-center align-items-center flex-column"
    >
      <div class="card shadow-lg p-2 mb-5 rounded-full">
        <button
          id="theme-toggle"
          class="btn btn-secondary square-md btn-icon-circle rounded-full"
        >
          <i class="icon icon-sun-moon text-2xl"></i>
        </button>
      </div>
      <section class="card shadow-lg">
        <header class="card-header">
          <h1 class="card-title text-center text-primary text-3xl">Calculadora</h1>
        </header>
        <div class="card-body">
          <div class="card d-flex justify-content-center px-4 display">
            <span id="display" class="font-mono text-end text-4xl"></span>
          </div>
          <div class="pt-4">
            <div class="d-flex pb-2 gap-2">
              <button
                id="btn-clear"
                class="btn btn-lg btn-danger square-lg text-2xl flex-grow-1"
              >
                <i class="icon icon-circle-x"></i>
              </button>
              <button
                id="btn-backspace"
                class="btn btn-lg btn-danger square-lg text-2xl flex-grow-1"
              >
                <i class="icon icon-delete"></i>
              </button>
              <button
                id="btn-parenthesis-opened"
                class="btn btn-lg btn-primary square-lg text-2xl flex-grow-1"
              >
                (
              </button>
              <button
                id="btn-parenthesis-closed"
                class="btn btn-lg btn-primary square-lg text-2xl flex-grow-1"
              >
                )
              </button>
            </div>
            <div class="d-flex pb-2 gap-2">
              <button
                id="btn-seven"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                7
              </button>
              <button
                id="btn-eight"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                8
              </button>
              <button
                id="btn-nine"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                9
              </button>
              <button
                id="btn-divide"
                class="btn btn-lg btn-primary square-lg text-2xl flex-grow-1"
              >
                <i class="icon icon-divide"></i>
              </button>
            </div>
            <div class="d-flex pb-2 gap-2">
              <button
                id="btn-four"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                4
              </button>
              <button
                id="btn-five"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                5
              </button>
              <button
                id="btn-six"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                6
              </button>
              <button
                id="btn-times"
                class="btn btn-lg btn-primary square-lg text-2xl flex-grow-1"
              >
                <i class="icon icon-x"></i>
              </button>
            </div>
            <div class="d-flex pb-2 gap-2">
              <button
                id="btn-one"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                1
              </button>
              <button
                id="btn-two"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                2
              </button>
              <button
                id="btn-three"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                3
              </button>
              <button
                id="btn-plus"
                class="btn btn-lg btn-primary square-lg text-2xl flex-grow-1"
              >
                <i class="icon icon-plus"></i>
              </button>
            </div>
            <div class="d-flex gap-2">
              <button
                id="btn-dot"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                .
              </button>
              <button
                id="btn-zero"
                class="btn btn-lg btn-secondary square-lg text-2xl flex-grow-1"
              >
                0
              </button>
              <button
                id="btn-equal"
                class="btn btn-lg btn-success square-lg text-2xl flex-grow-1"
              >
                <i class="icon icon-equal"></i>
              </button>
              <button
                id="btn-minus"
                class="btn btn-lg btn-primary square-lg text-2xl flex-grow-1"
              >
                <i class="icon icon-minus"></i>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
