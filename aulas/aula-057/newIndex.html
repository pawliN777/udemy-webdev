<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
  </head>
  <body>
    <section>
      <h1>Calculadora</h1>
      <table>
        <tr>
          <td colspan="4"><input id="display" type="text"></td>
        </tr>
        <tr>
          <td><button id="clear">C</button></td>
          <td><button id="number">(</button></td>
          <td><button id="number">)</button></td>
          <td><button id="number">/</button></td>
        </tr>
        <tr>
          <td><button id="number">7</button></td>
          <td><button id="number">8</button></td>
          <td><button id="number">9</button></td>
          <td><button id="number">*</button></td>
        </tr>
        <tr>
          <td><button id="number">4</button></td>
          <td><button id="number">5</button></td>
          <td><button id="number">6</button></td>
          <td><button id="number">+</button></td>
        </tr>
        <tr>
          <td><button id="number">1</button></td>
          <td><button id="number">2</button></td>
          <td><button id="number">3</button></td>
          <td><button id="number">-</button></td>
        </tr>
        <tr>
          <td><button id="number">.</button></td>
          <td><button id="number">0</button></td>
          <td><button id="backspace">&laquo;</button></td>
          <td><button id="equal">=</button></td>
        </tr>
      </table>
    </section>
    <script type="module" src="./src/newMain.js"></script>
  </body>
</html>
