<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../pipastyle/main.css" />
    <title>Aula 47 - Cronômetro</title>
  </head>
  <body>
    <main
      class="container center-screen"
    >
      <div class="card shadow-lg p-2 mb-5 rounded-full">
        <button
          id="theme-toggle"
          class="btn btn-secondary square-md btn-icon-circle rounded-full"
        >
          <i class="icon-sun-moon text-2xl"></i>
        </button>
      </div>
      <section class="card">
        <header class="card-title text-primary mb-2">
          <h1>Cronômetro</h1>
        </header>
        <div class="d-flex justify-content-center">
          <h1 id="timer" class="font-mono text-4xl mb-2">00:00:00</h1>
        </div>
        <div class="d-flex mb-2">
          <button
            id="start"
            class="btn btn-primary btn-md flex-grow-1"
          >
            Iniciar
          </button>
        </div>
        <div class="d-flex gap-2">
          <button
            id="pause"
            class="btn btn-secondary btn-md flex-grow-1"
          >
            Parar
          </button>
          <button
            id="reset"
            class="btn btn-secondary btn-md flex-grow-1"
          >
            Zerar
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
