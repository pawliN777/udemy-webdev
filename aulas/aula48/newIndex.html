<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../pipastyle/main.css">
    <title>Aula 48 - Lista de Tarefas Nova</title>
</head>
<body class="bg-gray-200">
    <main class="min-h-screen d-flex justify-content-center align-items-center flex-column">
        <div class="card shadow-lg p-2 mb-5 rounded-full">
            <button id="theme-toggle" class="btn btn-secondary square-md btn-icon-circle rounded-full">🌗</button>
        </div>
        <section class="card d-flex gap-2 w-50">
            <header class="card-header bg-white">
                <h1 class="card-title text-center text-primary text-3xl">Lista de Tarefas</h1>
            </header>
            <div class="card-body">
                <div class="form-group">
                    <input id="task-input" type="text" class="form-control" placeholder="Ex.: Ir ao mercado às 10h">
                </div>
                <div class="form-group text-right">
                    <button id="task-button" class="btn btn-primary btn-md w-100">Adicionar</button>
                </div>
                <ul id="task-list" class="m-0 p-0 mt-4"></ul>
            </div>
        </section>
    </main>
    <script type="module" src="./newJS/newMain.js"></script>
</body>
</html>
