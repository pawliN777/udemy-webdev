<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../pipastyle/main.css">
    <title>Aula 48 - Lista de Tarefas Nova</title>
</head>
<body class="bg-gray-100 py-5">
    <main class="container">
        <section class="card">
            <header class="card-header bg-white">
                <h1 class="card-title text-center text-primary text-3xl">Lista de Tarefas</h1>
            </header>
            
            <div class="card-body p-5">
                <div class="form-group mb-4">
                    <input id="task-input" type="text" class="form-control w-100 p-3 text-lg" placeholder="O que precisa ser feito?">
                </div>
                
                <div class="form-group mb-0 text-right">
                    <button id="task-button" class="btn btn-primary btn-lg w-100">Adicionar</button>
                </div>
                
                <ul id="task-list" class="m-0 p-0 mt-4"></ul>
            </div>
        </section>
    </main>

    <script type="module" src="./newJS/newMain.js"></script>
</body>
</html>
