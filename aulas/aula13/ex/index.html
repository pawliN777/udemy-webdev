<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 13</title>

    <style>
        html{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    

    <script>
        const name = prompt('Digite seu nome completo:');
        window.document.body.innerHTML += `O seu nome é <strong>${name}<strong/><br/>`;
        window.document.body.innerHTML += `O seu nome tem <strong>${name.replace(/\s/g, '').length} letras<strong/><br/>`;
        window.document.body.innerHTMl += `A segunda letra do seu nome é <strong>${name[1]}<strong/><br/>`;
        window.document.body.innerHTML += `O primeiro índice da letra a do seu nome: <strong>${name.indexOf('a')}<strong/><br/>`;
        window.document.body.innerHTML += `O último índice da letra a do seu nome <strong>${name.lastIndexOf('a')}<strong/><br/>`;
        window.document.body.innerHTML += `As últimas 3 letras do seu nome: <strong>${name.slice(-3)}<strong/><br/>`;
        window.document.body.innerHTML += `As palavras do seu nome são: <strong>${name.split(' ')}<strong/><br/>`;
        window.document.body.innerHTML += `Seu nome com letras maiúsculas: <strong>${name.toUpperCase()}<strong/><br/>`;
        window.document.body.innerHTML += `Seu nome com letras minúsculas: <strong>${name.toLowerCase()}<strong/><br/>`;
    </script>
</body>
</html>
